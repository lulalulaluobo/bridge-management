worker_processes 1;
error_log /tmp/fridge-agent-nginx-error.log;
pid /tmp/fridge-agent-nginx.pid;

events { worker_connections 256; }

http {
  include /opt/homebrew/etc/nginx/mime.types;
  default_type application/octet-stream;

  server {
    listen 8080;
    server_name _;
    location = /local-ca.pem {
      alias "/Users/luluen/Library/Application Support/mkcert/rootCA.pem";
      add_header Content-Type application/x-pem-file;
      add_header Content-Disposition 'attachment; filename="fridge-agent-local-ca.pem"';
    }
    location / { return 404; }
  }

  server {
    listen 8443 ssl;
    server_name lukedeMac-mini.local;
    # 手机相机照片常超过 Nginx 默认的 1MB；应用层仍会拒绝超过 8MB 的图片。
    client_max_body_size 10m;

    ssl_certificate /Users/luluen/ai-project/bridge-management/apps/web/.local-certs/fridge-agent.pem;
    ssl_certificate_key /Users/luluen/ai-project/bridge-management/apps/web/.local-certs/fridge-agent-key.pem;

    location = /local-ca.pem {
      alias "/Users/luluen/Library/Application Support/mkcert/rootCA.pem";
      add_header Content-Type application/x-pem-file;
      add_header Content-Disposition 'attachment; filename="fridge-agent-local-ca.pem"';
    }

    location / {
      proxy_pass http://127.0.0.1:3012;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
