services:
  fridge-agent:
    build:
      context: ./apps/web
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      FRIDGE_DATABASE_PATH: /data/fridge.db
      LOCAL_ASR_URL: http://local-asr:8787
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - fridge-data:/data

volumes:
  fridge-data:

networks:
  default:
    name: fridge-agent_default
    external: true
