services:
  fridge-agent:
    image: lulalulaluobo/bridge-management:latest
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      FRIDGE_DATABASE_PATH: /data/fridge.db
      LOCAL_ASR_URL: http://local-asr:8787
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - fridge-data:/data
    depends_on:
      - local-asr

  local-asr:
    image: lulalulaluobo/bridge-management-asr:latest
    restart: unless-stopped
    volumes:
      - asr-models:/models

volumes:
  fridge-data:
  asr-models:

networks:
  default:
    name: fridge-agent_default
